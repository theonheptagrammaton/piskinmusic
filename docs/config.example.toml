# ~/.config/amtui/config.toml — every key is optional.

[theme]
# piskin (default) | apple | catppuccin | gruvbox | nord | mono | auto
# All original palettes are explicit legacy choices; saved choices are honored.
# An existing color-only config with no named/saved palette keeps the apple base.
# "auto" takes the accent from artwork only when explicitly selected.
# PISKIN always keeps the shell monochrome, with original-color artwork.
name = "piskin"

# Overrides apply to named legacy palettes; piskin remains fixed monochrome.
# Hex only, and keep the quotes.
# accent     = "#FA233B"
# accent_hi  = "#FB5C74"
# accent_lo  = "#8A1E30"
# fg_bright  = "#F2F2F7"
# fg_dim     = "#8E8E93"
# fg_faint   = "#5A5A5E"
# border_dim = "#3A3A3C"
# sel_bg     = "#2C2C2E"
# background = "#000000"
# selected_text = "#F2F2F7"

[ui]
# Keep shape orientation still, disable bass pulse, and limit data updates to 10 Hz.
# Idle and hidden UI ticks run at 4 Hz; capture/history continue independently.
reduced_motion = false

[visualizer]
demo  = false  # opt into legacy DEMO/SIMULATED bands only if capture is unavailable
peaks = true   # falling peak markers above the spectrum bars
pulse = true   # accent brightness pulses with the bass
wave  = true   # progress bar shows recorded band-derived loudness (not PCM)

# The mode — bars, torus, sphere or waveform — is not set here. Press "v"
# to cycle it; the choice is remembered in ~/.config/amtui/vizmode, the same way the theme
# is, so toggling it never rewrites this file and loses your comments.

# Scrobbling is off until all three parts are in place. Create the key and
# secret at https://www.last.fm/api/account/create, put them here, then run
# `amtui lastfm-auth` once — it saves a session key to ~/.config/amtui/lastfm,
# so this file never has to hold it.
# [lastfm]
# api_key    = ""
# api_secret = ""

[artwork]
enabled = true
# Hide the cover when fewer than this many columns would be left for lyrics.
min_lyrics_width = 30
